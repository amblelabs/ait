name: Publish on GitHub, Modrinth, and CurseForge

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Generate Changelog
    types:
      - completed

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/release'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # For PackSquash

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'microsoft'
          cache: 'gradle'

      - name: Build
        run: |
          ./gradlew runDatagen
          ./gradlew build

      # PackSquash requires a pack.mcmeta at the root of pack_directory
      - name: Create pack.mcmeta
        run: echo '{"pack":{"description":"AIT Resources.","pack_format":15}}' > ./build/resources/main/pack.mcmeta

      - name: Run PackSquash
        uses: ComunidadAylas/PackSquash-action@v4
        with:
          packsquash_version: latest
          options: |
            pack_directory = './build/resources/main/'
            output_file_path = '/tmp/pack.zip'

      - name: Combine
        run: ./scripts/merge_jar ./build/libs/ /tmp/pack.zip
    
      - name: Publish (CurseForge/Modrinth/GitHub)
        uses: Kir-Antipov/mc-publish@v3.3                                   #The specified MC-Publish GitHub Action in the version 3.2
        with:
          changelog-file: CHANGELOG.md
          curseforge-id: 856138                                             #The id of your CurseForge project
          curseforge-token: "${{secrets.CURSEFORGE_TOKEN}}"

          modrinth-id: ZMP9ZjB9                                             #The id of your modrinth project
          modrinth-token: "${{secrets.MODRINTH_TOKEN}}"

          github-token: "${{secrets.GITHUB_TOKEN}}"

          github-generate-changelog: true
          version-type: release

          loaders: fabric
          java: "${{env.JAVA_VERSION}}"
